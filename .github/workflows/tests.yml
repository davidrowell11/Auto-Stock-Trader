name: tests
on: [push, pull_request]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run engine tests
        working-directory: engine
        run: PYTHONPATH=.:tests python -m unittest discover -s tests -v
